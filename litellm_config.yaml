model_list:
  # Best Qwen models (mapped to Claude model names so Claude Code recognizes them)
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/qwen/qwen3-235b-a22b-thinking-2507
      api_base: https://api.novita.ai/openai
      api_key: os.environ/NOVITA_API_KEY
      max_tokens: 16384
      temperature: 0.7

  - model_name: claude-opus-4-6
    litellm_params:
      model: openai/qwen/qwen3.5-397b-a17b
      api_base: https://api.novita.ai/openai
      api_key: os.environ/NOVITA_API_KEY
      max_tokens: 16384
      temperature: 0.7

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/deepseek/deepseek-v3.2
      api_base: https://api.novita.ai/openai
      api_key: os.environ/NOVITA_API_KEY
      max_tokens: 16384
      temperature: 0.7

  # Fallback: any model name gets routed to Qwen thinking model
  - model_name: "*"
    litellm_params:
      model: openai/qwen/qwen3-235b-a22b-thinking-2507
      api_base: https://api.novita.ai/openai
      api_key: os.environ/NOVITA_API_KEY
      max_tokens: 16384

litellm_settings:
  drop_params: true
  set_verbose: false
